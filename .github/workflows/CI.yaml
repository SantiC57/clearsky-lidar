name: ClearSky LiDAR CI/CD

on:
  push:
    branches: [main, dev]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main, dev]

permissions:
  contents: write

jobs:
  test-dev:
    name: Test desarrollo (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.8', '3.10']

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e . --no-deps -v

      - name: Verificar instalación
        run: |
          pip list | grep clearsky
          python -c "import clearsky_lidar; print('OK:', clearsky_lidar.__version__)"

      - name: Correr tests unitarios
        run: pytest tests/ -v --ignore=tests/test_integration.py

  test-jetson:
    name: Test Jetson Nano (Ubuntu 20.04 / Python 3.6)
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python 3.6
        run: |
          sudo apt-get update
          sudo apt-get install -y python3.6 python3.6-distutils curl
          curl https://bootstrap.pypa.io/pip/3.6/get-pip.py -o get-pip.py
          python3.6 get-pip.py

      - name: Instalar dependencias
        run: |
          python3.6 -m pip install pytest
          python3.6 -m pip install -e .

      - name: Correr tests unitarios
        run: python3.6 -m pytest tests/ -v --ignore=tests/test_integration.py
  release:
    name: Crear Release
    needs: [test-dev, test-jetson]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Extraer versión del tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Extraer notas del CHANGELOG
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES=$(awk "/## ${VERSION}/,/## v[0-9]/" CHANGELOG.md | sed '$d')
          echo "NOTES<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "ClearSky LiDAR ${{ steps.version.outputs.VERSION }}"
          body: ${{ steps.changelog.outputs.NOTES }}
          draft: false
          prerelease: false
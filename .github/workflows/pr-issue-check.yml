name: PR Issue Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  issues: read
  pull-requests: read

jobs:
  check-issue-approval:
    name: Verify linked issue is approved
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Extract issue numbers from PR
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const title = context.payload.pull_request.title || '';
            const text = `${title}\n${body}`;
            
            // Patrones: Closes #123, Fixes #123, Resolves #123, Relacionado a #123, Related to #123
            const patterns = [
              /(?:closes?|fixes?|resolves?|relacionado\s+a|related\s+to)\s+#(\d+)/gi,
              /#(\d+)/g  // fallback: cualquier #N en título/cuerpo
            ];
            
            const issues = new Set();
            for (const pattern of patterns) {
              let match;
              while ((match = pattern.exec(text)) !== null) {
                issues.add(match[1]);
              }
            }
            
            const issueNumbers = Array.from(issues);
            console.log(`Issues encontrados: ${issueNumbers.join(', ') || 'ninguno'}`);
            
            if (issueNumbers.length === 0) {
              core.setFailed('❌ El PR no menciona ningún issue. Agrega "Closes #N", "Fixes #N", "Resolves #N" o "Relacionado a #N" en el título o cuerpo.');
              return;
            }
            
            core.setOutput('issue_numbers', issueNumbers.join(','));

      - name: Verify each issue has "approved" label
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumbers = '${{ steps.extract.outputs.issue_numbers }}'.split(',').filter(Boolean);
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            
            for (const num of issueNumbers) {
              console.log(`Verificando issue #${num}...`);
              
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: parseInt(num, 10)
                });
                
                const hasApproved = issue.labels.some(l => l.name === 'approved');
                
                if (!hasApproved) {
                  core.setFailed(`❌ El issue #${num} NO tiene la etiqueta "approved". Pídele a tu compañero que la agregue antes de abrir el PR.`);
                  return;
                }
                
                console.log(`✅ Issue #${num} tiene etiqueta "approved".`);
              } catch (err) {
                if (err.status === 404) {
                  core.setFailed(`❌ El issue #${num} no existe en este repositorio.`);
                } else {
                  core.setFailed(`❌ Error consultando issue #${num}: ${err.message}`);
                }
                return;
              }
            }
            
            console.log('✅ Todos los issues vinculados están aprobados.');
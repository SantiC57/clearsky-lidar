[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearsky-lidar"
version = "0.1.0"
description = "Biblioteca de captura LiDAR para el proyecto ClearSky"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.7"
authors = [
    {name = "ClearSky Team"},
]
keywords = ["lidar", "slamtec", "m1m1", "drone", "waste-detection", "point-cloud", "classification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
lidar = [
    "open3d>=0.14",
    "numpy",
]
processing = [
    "scipy",
]
visualization = [
    "Pillow",
]
training = [
    "ultralytics==8.0.196",
    "mlflow>=2.0",
    "albumentations>=1.3",
    "torch>=1.13",
    "torchvision>=0.14",
    "pyyaml",
]
inference = [
    "ultralytics==8.0.196",
    "torch>=1.13",
]
remote = [
    "requests>=2.25",
    "opencv-python>=4.5",
]
dev = [
    "pytest",
    "pyyaml",
    "pytest-mock",
]
all = [
    "scipy",
    "Pillow",
    "pytest",
    "pyyaml",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clearsky_lidar*"]

[tool.pytest.ini_options]
markers = [
    "gpu: marks tests requiring GPU",
    "integration: marks integration tests",
    "slow: marks slow tests (>30s)",
]
testpaths = ["tests"]
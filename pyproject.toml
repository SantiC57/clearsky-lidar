[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearsky-lidar"
version = "0.1.0"
description = "Biblioteca de captura LiDAR para el proyecto ClearSky"
requires-python = ">=3.6"
dependencies = []

[project.optional-dependencies]
lidar = [
    "open3d>=0.14",
    "numpy",
]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["clearsky_lidar*"]